<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Store Analytics - Console Test</title>
    <style>
      body {
        font-family: "Courier New", monospace;
        padding: 20px;
        background: #1e1e1e;
        color: #d4d4d4;
      }
      h1 {
        color: #4ec9b0;
      }
      p {
        color: #ce9178;
      }
      #output {
        margin-top: 20px;
        white-space: pre-wrap;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Store Analytics Report</h1>
    <p>
      Ava Chrome DevTools (F12) ja vaata Console tab'i. Väljund kuvatakse ka
      allpool:
    </p>
    <div id="output"></div>

    <script type="module">
      import { storeData } from "/dist/data/mockData.js";
      import {
        calculateTotalStock,
        calculateAverageRating,
        getStockStatus,
        calculateDiscountedPrice,
        formatSpecifications,
      } from "/dist/utils/calculations.js";

      const outputDiv = document.getElementById("output");

      function log(text) {
        console.log(text);
        outputDiv.textContent += text + "\n";
      }

      function generateReport() {
        log("Products:");
        log("");

        for (const product of storeData.products) {
          const supplier = storeData.suppliers.find(
            (s) => s.id === product.supplierId,
          );
          if (!supplier) continue;

          const totalStock = calculateTotalStock(product.id, storeData.stocks);
          const stockStatus = getStockStatus(totalStock);
          const averageRating = calculateAverageRating(
            product.id,
            storeData.reviews,
          );
          const discountInfo = calculateDiscountedPrice(
            product,
            averageRating,
            storeData.discountRules,
          );
          const specsFormatted = formatSpecifications(product.specs);

          const ratingText =
            averageRating === null ? "no reviews" : averageRating.toFixed(2);

          let priceText;
          if (discountInfo) {
            const discountedPrice = discountInfo.discountedPrice.toFixed(2);
            priceText = `${product.price.toFixed(2)} -> ${discountedPrice}`;
          } else {
            priceText = product.price.toFixed(2);
          }

          log(
            `  - ${product.name} [${product.id}] | ${product.category} | supplier: ${supplier.name} | available: ${totalStock} (${stockStatus}) | rating: ${ratingText} | ${specsFormatted ? `specs: ${specsFormatted} | ` : ""}price: ${priceText}`,
          );
        }
      }

      try {
        generateReport();
      } catch (error) {
        console.error("Error:", error);
        outputDiv.textContent =
          "ERROR: " +
          error.message +
          "\n\nCheck browser console (F12) for details.";
        outputDiv.style.color = "#f48771";
      }
    </script>
  </body>
</html>

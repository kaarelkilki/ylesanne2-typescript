<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ülesanne 2 - Toote Haldus</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Toodete Haldussüsteem</h1>
        <p class="subtitle">TypeScript Interaktiivne Veebirakendus</p>
      </header>

      <main>
        <!-- Messages container -->
        <div id="messages"></div>

        <!-- Add Product Form -->
        <section class="add-product-section">
          <h2>Lisa uus toode</h2>
          <form id="add-product-form">
            <div class="form-group">
              <label for="name">Toote nimi:</label>
              <input
                type="text"
                id="name"
                name="name"
                autocomplete="off"
                required
                placeholder="nt. Dell XPS 15"
              />
            </div>

            <div class="form-group">
              <label for="price">Hind (€):</label>
              <input
                type="number"
                id="price"
                name="price"
                autocomplete="off"
                step="0.01"
                min="0"
                required
                placeholder="0.00"
              />
            </div>

            <div class="form-group">
              <label for="category">Kategooria:</label>
              <input
                type="text"
                id="category"
                name="category"
                list="category-list"
                autocomplete="off"
                required
                placeholder="nt. Electronics"
              />
              <datalist id="category-list">
                <!-- Categories will be populated dynamically -->
              </datalist>
            </div>

            <div class="form-group">
              <label for="supplierId">Tarnija ID:</label>
              <input
                type="text"
                id="supplierId"
                name="supplierId"
                autocomplete="off"
                required
                placeholder="nt. S1"
              />
            </div>

            <div class="form-group">
              <label for="quantity">Laoseis (tk):</label>
              <input
                type="number"
                id="quantity"
                name="quantity"
                autocomplete="off"
                min="0"
                step="1"
                required
                placeholder="0"
              />
            </div>

            <div class="form-group specs-section">
              <div class="specs-label">Spetsifikatsioonid (valikuline):</div>
              <div class="specs-inputs">
                <input
                  type="text"
                  name="specKey1"
                  autocomplete="off"
                  placeholder="Võti (nt. cpu)"
                  class="spec-key"
                />
                <input
                  type="text"
                  name="specValue1"
                  autocomplete="off"
                  placeholder="Väärtus (nt. Intel i7)"
                  class="spec-value"
                />
              </div>
              <div class="specs-inputs">
                <input
                  type="text"
                  name="specKey2"
                  autocomplete="off"
                  placeholder="Võti (nt. ram)"
                  class="spec-key"
                />
                <input
                  type="text"
                  name="specValue2"
                  autocomplete="off"
                  placeholder="Väärtus (nt. 16GB)"
                  class="spec-value"
                />
              </div>
              <div class="specs-inputs">
                <input
                  type="text"
                  name="specKey3"
                  autocomplete="off"
                  placeholder="Võti (nt. storage)"
                  class="spec-key"
                />
                <input
                  type="text"
                  name="specValue3"
                  autocomplete="off"
                  placeholder="Väärtus (nt. 512GB)"
                  class="spec-value"
                />
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Lisa toode</button>
          </form>
        </section>

        <!-- Filter and Sort Controls -->
        <section class="controls-section">
          <div class="controls">
            <div class="control-group">
              <label for="filter">Filtreeri:</label>
              <select id="filter">
                <option value="all">Kõik tooted</option>
                <option value="in-stock">Laos (IN_STOCK)</option>
                <option value="low-stock">Vähene (LOW)</option>
                <option value="out-of-stock">Otsas (OUT)</option>
                <option value="Electronics">Electronics</option>
                <option value="Accessories">Accessories</option>
                <option value="Books">Books</option>
              </select>
            </div>

            <div class="control-group">
              <label for="sort">Sorteeri:</label>
              <select id="sort">
                <option value="name">Nime järgi</option>
                <option value="price-asc">Hind (odavamad enne)</option>
                <option value="price-desc">Hind (kallimad enne)</option>
                <option value="category">Kategooria järgi</option>
                <option value="stock">Laoseisu järgi</option>
              </select>
            </div>

            <button id="reset-btn" class="btn btn-secondary">
              Taasta algandmed
            </button>
          </div>

          <div id="product-count" class="product-count">Tooteid kokku: 0</div>
        </section>

        <!-- Products Display -->
        <section class="products-section">
          <h2>Tooted</h2>
          <div id="products-container" class="products-grid">
            <!-- Products will be rendered here dynamically -->
          </div>
        </section>
      </main>

      <footer>
        <p>&copy; 2026 TypeScript Ülesanne 2</p>
      </footer>
    </div>

    <script type="module" src="../../dist/web/app.js"></script>
  </body>
</html>
